services:
  - type: web
    name: bold-caption-bot
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    autoDeploy: true

    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: OWNER_ID
        sync: false
